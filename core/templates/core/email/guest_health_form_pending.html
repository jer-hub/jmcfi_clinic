<!DOCTYPE html>
<html>
<body style="font-family: system-ui, sans-serif; color: #111827; line-height: 1.5;">
  <p>Hello {{ patient_name }},</p>
  <p><strong>{{ clinic_name }}</strong> started a health profile form for you. Some details still need to be completed.</p>
  <p>
    <a href="{{ access_url }}" style="display:inline-block;padding:10px 16px;background:#7c3aed;color:#fff;text-decoration:none;border-radius:8px;">
      Complete or cancel your health form
    </a>
  </p>
  <p style="font-size:12px;color:#6b7280;">You can finish the form or cancel the draft from this link. It expires in a few days.</p>
  <p>— {{ clinic_name }}</p>
</body>
</html>
