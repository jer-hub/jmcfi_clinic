{% comment %}
  Account accordion (mobile drawer). Expects parent nav x-data: mobilePanel.
  Sign out stays outside the panel so it remains visible without expanding.
{% endcomment %}
<button type="button"
  id="nav-mobile-account-trigger"
  class="mobile-link w-full text-left flex items-center justify-between {% if nav_active.profile or nav_active.profile_preferences %}active{% endif %}"
  @click="mobilePanel = mobilePanel === 'account' ? '' : 'account'"
  :class="mobilePanel === 'account' ? 'active' : ''"
  :aria-expanded="(mobilePanel === 'account').toString()"
  aria-controls="nav-mobile-account-panel">
  <span>Account</span>
  <i class="fas fa-chevron-down text-xs shrink-0 transition-transform duration-200 ease-out" :class="mobilePanel === 'account' ? 'rotate-180' : ''" aria-hidden="true"></i>
</button>
<div id="nav-mobile-account-panel"
  x-show="mobilePanel === 'account'"
  x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 -translate-y-1"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 -translate-y-1"
  role="region"
  aria-labelledby="nav-mobile-account-trigger"
  class="overflow-hidden px-2 pb-1">
  <a href="{% url 'core:profile' %}" class="mobile-link text-sm {% if nav_active.profile %}active{% endif %}">Profile</a>
  <a href="{% url 'core:profile_preferences' %}" class="mobile-link text-sm {% if nav_active.profile_preferences %}active{% endif %}">Preferences</a>
</div>
<form method="post" action="{% url 'account_logout' %}" class="px-0">
  {% csrf_token %}
  <button type="submit" class="mobile-link w-full text-left text-gray-700 hover:text-gray-900">
    Sign out
  </button>
</form>
