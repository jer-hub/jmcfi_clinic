{% load role_tags %}
<nav class="w-full" aria-label="Profile sections">
  <div role="tablist"
       class="flex w-full p-1 bg-gray-100 border border-gray-200 rounded-lg gap-0.5">
    <button type="button"
            role="tab"
            :aria-selected="(activeTab === 'personal').toString()"
            @click="activeTab = 'personal'"
            :class="activeTab === 'personal' ? 'bg-white text-primary-700 shadow-sm' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'"
            class="flex-1 min-w-0 inline-flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-1.5 px-1.5 sm:px-3 py-2 text-[11px] leading-tight sm:text-sm font-medium rounded-md transition-colors">
      <i class="fas fa-user text-[11px] sm:text-xs shrink-0" aria-hidden="true"></i>
      <span class="truncate max-w-full">Personal</span>
    </button>
    <button type="button"
            role="tab"
            :aria-selected="(activeTab === 'contact').toString()"
            @click="activeTab = 'contact'"
            :class="activeTab === 'contact' ? 'bg-white text-primary-700 shadow-sm' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'"
            class="flex-1 min-w-0 inline-flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-1.5 px-1.5 sm:px-3 py-2 text-[11px] leading-tight sm:text-sm font-medium rounded-md transition-colors">
      <i class="fas fa-phone text-[11px] sm:text-xs shrink-0" aria-hidden="true"></i>
      <span class="truncate max-w-full">Contact</span>
    </button>
    {% if user.role != 'doctor' and user.role != 'admin' %}
    <button type="button"
            role="tab"
            :aria-selected="(activeTab === 'medical').toString()"
            @click="activeTab = 'medical'"
            :class="activeTab === 'medical' ? 'bg-white text-primary-700 shadow-sm' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'"
            class="flex-1 min-w-0 inline-flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-1.5 px-1.5 sm:px-3 py-2 text-[11px] leading-tight sm:text-sm font-medium rounded-md transition-colors">
      <i class="fas fa-notes-medical text-[11px] sm:text-xs shrink-0" aria-hidden="true"></i>
      <span class="truncate max-w-full">Medical</span>
    </button>
    {% endif %}
    {% if user|is_patient_role and not user|is_walk_in_user %}
    <button type="button"
            role="tab"
            :aria-selected="(activeTab === 'academic').toString()"
            @click="activeTab = 'academic'"
            :class="activeTab === 'academic' ? 'bg-white text-primary-700 shadow-sm' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'"
            class="flex-1 min-w-0 inline-flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-1.5 px-1.5 sm:px-3 py-2 text-[11px] leading-tight sm:text-sm font-medium rounded-md transition-colors">
      <i class="fas fa-graduation-cap text-[11px] sm:text-xs shrink-0" aria-hidden="true"></i>
      <span class="truncate max-w-full">{% if profile.is_employee %}Department{% else %}Academic{% endif %}</span>
    </button>
    {% elif user.role == 'staff' or user.role == 'doctor' %}
    <button type="button"
            role="tab"
            :aria-selected="(activeTab === 'professional').toString()"
            @click="activeTab = 'professional'"
            :class="activeTab === 'professional' ? 'bg-white text-primary-700 shadow-sm' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'"
            class="flex-1 min-w-0 inline-flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-1.5 px-1.5 sm:px-3 py-2 text-[11px] leading-tight sm:text-sm font-medium rounded-md transition-colors">
      <i class="fas fa-briefcase-medical text-[11px] sm:text-xs shrink-0" aria-hidden="true"></i>
      <span class="truncate max-w-full">Professional</span>
    </button>
    {% endif %}
  </div>
</nav>
