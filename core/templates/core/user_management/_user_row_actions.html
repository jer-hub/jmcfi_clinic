{% comment %}
  Row/card action icons for the active user list.
  Expects: user_item
{% endcomment %}
<div class="inline-flex items-center justify-end gap-0.5">
  <a href="{% url 'core:user_detail' user_item.id %}"
     class="p-1.5 text-primary-600 hover:bg-primary-50 rounded-lg transition-colors"
     title="View">
    <i class="fas fa-eye" aria-hidden="true"></i>
  </a>
  <a href="{% url 'core:user_edit' user_item.id %}"
     class="p-1.5 text-info-600 hover:bg-info-50 rounded-lg transition-colors"
     title="Edit">
    <i class="fas fa-pen-to-square" aria-hidden="true"></i>
  </a>
  {% if user_item.role != 'admin' and user_item.id != request.user.id %}
  <button type="button"
          x-data="{}"
          @click="$dispatch('open-modal', {type:'warning', title:'Change Role', subtitle:'{{ user_item.get_full_name|escapejs }} ({{ user_item.email|escapejs }})', size:'lg', hxUrl:'{% url 'core:user_change_role' user_item.id %}', actionLabel:'Change Role', hasForm:true})"
          class="p-1.5 text-amber-600 hover:bg-amber-50 rounded-lg transition-colors"
          title="Change role">
    <i class="fas fa-user-tag" aria-hidden="true"></i>
  </button>
  {% endif %}
</div>
