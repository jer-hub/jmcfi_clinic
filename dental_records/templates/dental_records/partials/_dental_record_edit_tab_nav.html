{# Edit-mode tabs — data-tab / health-form-edit.js (matches health forms edit UX) #}
{% with tab_btn="tab-btn flex-1 min-w-0 px-1 sm:px-1.5 py-2 sm:py-2.5 text-[10px] sm:text-xs font-medium text-center" %}
<nav class="grid grid-cols-4 sm:flex sm:w-full -mb-px" id="dental-record-tabs" role="tablist" aria-label="Dental record sections">
  <button type="button" data-tab="demographics" role="tab"
          aria-selected="{% if active_section == 'demographics' %}true{% else %}false{% endif %}"
          title="Demographics"
          class="{{ tab_btn }} {% if active_section == 'demographics' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-user flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Demographics</span>
    </span>
    <span data-tab-badge="demographics" class="hidden ml-1 inline-flex items-center" aria-hidden="true"></span>
  </button>
  <button type="button" data-tab="questionnaire" role="tab"
          aria-selected="{% if active_section == 'questionnaire' %}true{% else %}false{% endif %}"
          title="Health Questionnaire"
          class="{{ tab_btn }} {% if active_section == 'questionnaire' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-clipboard-list flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Health Q.</span>
    </span>
    <span data-tab-badge="questionnaire" class="hidden ml-1 inline-flex items-center" aria-hidden="true"></span>
  </button>
  <button type="button" data-tab="systems" role="tab"
          aria-selected="{% if active_section == 'systems' %}true{% else %}false{% endif %}"
          title="Systems Review"
          class="{{ tab_btn }} {% if active_section == 'systems' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-heartbeat flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Systems</span>
    </span>
    <span data-tab-badge="systems" class="hidden ml-1 inline-flex items-center" aria-hidden="true"></span>
  </button>
  <button type="button" data-tab="history" role="tab"
          aria-selected="{% if active_section == 'history' %}true{% else %}false{% endif %}"
          title="Dental History"
          class="{{ tab_btn }} {% if active_section == 'history' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-history flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">History</span>
    </span>
    <span data-tab-badge="history" class="hidden ml-1 inline-flex items-center" aria-hidden="true"></span>
  </button>
  {% if is_pediatric %}
  <button type="button" data-tab="pediatric" role="tab"
          aria-selected="{% if active_section == 'pediatric' %}true{% else %}false{% endif %}"
          title="Pediatric Patient History"
          class="{{ tab_btn }} {% if active_section == 'pediatric' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-child flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Pediatric</span>
    </span>
    <span data-tab-badge="pediatric" class="hidden ml-1 inline-flex items-center" aria-hidden="true"></span>
  </button>
  {% endif %}
  <button type="button" data-tab="exam" role="tab"
          aria-selected="{% if active_section == 'exam' %}true{% else %}false{% endif %}"
          title="Extraoral & Intraoral Examination"
          class="{{ tab_btn }} {% if active_section == 'exam' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-stethoscope flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Exam</span>
    </span>
    <span data-tab-badge="exam" class="hidden ml-1 inline-flex items-center" aria-hidden="true"></span>
  </button>
  <button type="button" data-tab="vitals" role="tab"
          aria-selected="{% if active_section == 'vitals' %}true{% else %}false{% endif %}"
          title="Vital Signs"
          class="{{ tab_btn }} {% if active_section == 'vitals' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-thermometer flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Vitals</span>
    </span>
    <span data-tab-badge="vitals" class="hidden ml-1 inline-flex items-center" aria-hidden="true"></span>
  </button>
  <button type="button" data-tab="chart" role="tab"
          aria-selected="{% if active_section == 'chart' %}true{% else %}false{% endif %}"
          title="Interactive Dental Chart"
          class="{{ tab_btn }} {% if active_section == 'chart' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-teeth flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Chart</span>
    </span>
  </button>
  <button type="button" data-tab="notes" role="tab"
          aria-selected="{% if active_section == 'notes' %}true{% else %}false{% endif %}"
          title="Progress Notes"
          class="{{ tab_btn }} {% if active_section == 'notes' %}text-primary-600 border-b-2 border-primary-600 bg-primary-50/50{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-50{% endif %}">
    <span class="inline-flex items-center justify-center gap-1 min-w-0 max-w-full mx-auto">
      <i class="fas fa-notes-medical flex-shrink-0 text-[10px]" aria-hidden="true"></i>
      <span class="truncate">Notes</span>
    </span>
  </button>
</nav>
{% endwith %}
