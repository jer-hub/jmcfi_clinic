{# Args: icon, title, description (optional) #}
<div class="flex items-center gap-2 mb-4">
  <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-50 text-primary-600 flex-shrink-0">
    <i class="fas {{ icon }} text-sm"></i>
  </span>
  <div class="min-w-0">
    <h3 class="text-sm font-semibold text-gray-900">{{ title }}</h3>
    {% if description %}
    <p class="text-xs text-gray-500">{{ description }}</p>
    {% endif %}
  </div>
</div>
