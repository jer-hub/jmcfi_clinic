# Local Docker run for JMCFI Clinic
# Usage: docker compose up --build

services:
  web:
    build: .
    image: jmcfi-clinic:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override hostnames for container access on :8000
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SITE_URL: http://127.0.0.1:8000
      ACCOUNT_DEFAULT_HTTP_PROTOCOL: http
      PORT: "8000"
      # Keep DEBUG from .env; do not set APP_DOMAIN (fail-closed would require DEBUG=False)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
