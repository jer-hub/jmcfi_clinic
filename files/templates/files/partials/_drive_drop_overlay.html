{# Full-page drop hint while dragging files over My Drive #}
<div x-show="dragging"
     x-cloak
     x-transition.opacity.duration.150ms
     class="fixed inset-0 z-[60] flex items-center justify-center bg-primary-900/25 backdrop-blur-[1px] pointer-events-none"
     aria-hidden="true">
  <div class="rounded-2xl border-2 border-dashed border-primary-400 bg-white/95 px-8 py-10 shadow-xl text-center max-w-sm mx-4">
    <i class="fas fa-cloud-arrow-up text-3xl text-primary-600 mb-3" aria-hidden="true"></i>
    <p class="text-base font-semibold text-gray-900">Drop files to upload</p>
    <p class="text-sm text-gray-500 mt-1">
      {% if folder %}Into this folder{% else %}Into My Drive (root){% endif %}
    </p>
  </div>
</div>
