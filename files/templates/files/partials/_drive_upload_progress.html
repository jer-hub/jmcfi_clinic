{# Non-blocking upload progress — My Drive only #}
<div x-show="uploadPanelOpen"
     x-cloak
     x-transition:enter="transition ease-out duration-150"
     x-transition:enter-start="opacity-0 translate-y-2"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-100"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-2"
     class="fixed bottom-4 right-4 z-[65] w-[min(22rem,calc(100vw-2rem))] rounded-xl border border-gray-200 bg-white shadow-lg p-3.5"
     role="status"
     aria-live="polite">
  <div class="flex items-start gap-2.5">
    <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg"
         :class="uploadError ? 'bg-danger-50 text-danger-600' : (uploadDone ? 'bg-emerald-50 text-emerald-600' : 'bg-primary-50 text-primary-600')">
      <i class="fas text-sm"
         :class="uploadError ? 'fa-circle-exclamation' : (uploadDone ? 'fa-circle-check' : 'fa-cloud-arrow-up')"
         aria-hidden="true"></i>
    </div>
    <div class="min-w-0 flex-1 pr-1">
      <p class="text-sm font-medium text-gray-900 leading-5" x-text="uploadLabel">Uploading…</p>
      <p class="text-xs text-gray-500 mt-1 leading-4 truncate" x-show="uploadDetail" x-text="uploadDetail"></p>
      <p class="text-xs text-danger-600 mt-1 leading-4 break-words" x-show="uploadError" x-text="uploadError"></p>
    </div>
    <button type="button"
            class="shrink-0 inline-flex h-7 w-7 items-center justify-center rounded-md text-gray-400 hover:bg-gray-50 hover:text-gray-600"
            x-show="!uploading"
            @click="dismissUploadPanel()"
            aria-label="Dismiss">
      <i class="fas fa-xmark text-xs" aria-hidden="true"></i>
    </button>
  </div>
  <div class="mt-3" x-show="uploading || (!uploadDone && !uploadError)">
    <div class="h-1.5 w-full overflow-hidden rounded-full bg-gray-100">
      <div class="h-full rounded-full bg-primary-600 transition-[width] duration-150 ease-out"
           :style="`width: ${uploadProgress}%`"></div>
    </div>
    <p class="mt-1.5 text-[11px] tabular-nums text-gray-500" x-text="uploadProgress + '%'"></p>
  </div>
</div>
