{# Embedded markup copied into Alpine modal (# via embedFrom). Expects review_url_name, form_obj #}
<form method="post" action="{% url review_url_name form_obj.pk %}" class="space-y-4 text-left">
  {% csrf_token %}
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
    <select name="status"
            class="w-full px-3 py-2.5 sm:py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-400">
      <option value="completed" selected>Completed</option>
      <option value="rejected">Rejected — return for revision</option>
    </select>
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Review Notes</label>
    <textarea name="review_notes" rows="3"
              class="w-full px-3 py-2.5 sm:py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-400"
              placeholder="Optional notes..."></textarea>
  </div>
</form>
