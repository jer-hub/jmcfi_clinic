<div id="jmcfi-mc-list-filters"{% if swap_oob %} hx-swap-oob="true"{% endif %}>
  <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between gap-3">
    <h3 class="text-sm font-semibold text-gray-900 flex items-center gap-2 min-w-0">
      <i class="fas fa-filter text-primary-500" aria-hidden="true"></i>Filter
    </h3>
    <a href="{% url 'manage_concern:concern_list' %}"
       class="inline-flex shrink-0 items-center gap-2 px-3 py-1.5 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors whitespace-nowrap">
      <i class="fas fa-rotate-right" aria-hidden="true"></i>Clear
    </a>
  </div>
  <form method="GET"
        id="jmcfi-mc-list-filter-form"
        class="px-4 py-3 border-b border-gray-100 bg-gray-50/40"
        hx-get="{% url 'manage_concern:concern_list' %}"
        hx-target="body"
        hx-swap="none"
        hx-push-url="true"
        hx-trigger="change from:select, change from:input[type=date], keyup changed delay:300ms from:input[type=search], input changed delay:300ms from:input[type=search]"
        @submit.prevent>
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
      <div class="col-span-2 lg:col-span-4 min-w-0">
        <label for="mc_search" class="block text-xs font-semibold text-gray-700 mb-1">Search</label>
        <div class="relative">
          <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none" aria-hidden="true"></i>
          <input type="search"
                 id="mc_search"
                 name="search"
                 value="{{ search_query }}"
                 autocomplete="off"
                 placeholder="Name, department, concerns, management…"
                 class="block w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm">
        </div>
      </div>
      <div class="min-w-0">
        <label for="mc_date_from" class="block text-xs font-semibold text-gray-700 mb-1">From</label>
        <input type="date"
               id="mc_date_from"
               name="date_from"
               value="{{ date_from }}"
               class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm">
      </div>
      <div class="min-w-0">
        <label for="mc_date_to" class="block text-xs font-semibold text-gray-700 mb-1">To</label>
        <input type="date"
               id="mc_date_to"
               name="date_to"
               value="{{ date_to }}"
               class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm">
      </div>
      <div class="col-span-2 min-w-0">
        <label for="mc_affiliation" class="block text-xs font-semibold text-gray-700 mb-1">Affiliation</label>
        <select id="mc_affiliation"
                name="affiliation"
                class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm">
          <option value="">All</option>
          <option value="catalog" {% if affiliation == 'catalog' %}selected{% endif %}>Student</option>
          <option value="employee" {% if affiliation == 'employee' %}selected{% endif %}>Employee</option>
          <option value="others" {% if affiliation == 'others' %}selected{% endif %}>Others</option>
        </select>
      </div>
      {% if show_department_filter %}
      <div class="col-span-2 {% if show_program_year_filters %}lg:col-span-2{% else %}lg:col-span-4{% endif %} min-w-0">
        <label for="mc_department" class="block text-xs font-semibold text-gray-700 mb-1">Department</label>
        <select id="mc_department"
                name="department"
                class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm">
          <option value="">All departments</option>
          {% for college in filter_departments %}
          <option value="{{ college.pk }}" {% if department_id == college.pk %}selected{% endif %}>{{ college.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      {% if show_program_year_filters %}
      <div class="min-w-0">
        <label for="mc_program" class="block text-xs font-semibold text-gray-700 mb-1">Program</label>
        <select id="mc_program"
                name="program"
                class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm"
                {% if not department_id %}disabled{% endif %}>
          <option value="">{% if department_id %}All programs{% else %}Select department first{% endif %}</option>
          {% for program in filter_programs %}
          <option value="{{ program.pk }}" {% if program_id == program.pk %}selected{% endif %}>{{ program.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="min-w-0">
        <label for="mc_year_level" class="block text-xs font-semibold text-gray-700 mb-1">Year level</label>
        <select id="mc_year_level"
                name="year_level"
                class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm"
                {% if not department_id %}disabled{% endif %}>
          <option value="">{% if department_id %}All year levels{% else %}Select department first{% endif %}</option>
          {% for year in filter_year_levels %}
          <option value="{{ year.pk }}" {% if year_level_id == year.pk %}selected{% endif %}>{{ year.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
    </div>
  </form>
</div>
