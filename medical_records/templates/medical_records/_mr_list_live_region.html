{% load role_tags %}
<div id="jmcfi-mr-list-stats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
  {% include "medical_records/_mr_list_stat_cards_inner.html" %}
</div>

<div class="bg-white rounded-card shadow-sm border border-gray-200 overflow-hidden">
  <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between gap-3">
    <h3 class="text-base font-semibold text-gray-900 flex items-center gap-2 min-w-0">
      <i class="fas fa-filter text-primary-500"></i>Filter Records
    </h3>
    <a href="{% url 'medical_records:medical_records' %}" class="inline-flex shrink-0 items-center gap-2 px-3 py-1.5 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors whitespace-nowrap">
      <i class="fas fa-rotate-right" aria-hidden="true"></i>Clear
    </a>
  </div>
  <form method="GET"
        id="jmcfi-mr-list-filter-form"
        class="px-5 py-4 border-b border-gray-100 bg-gray-50/40"
        hx-get="{% url 'medical_records:medical_records' %}"
        hx-target="body"
        hx-swap="none"
        hx-push-url="true"
        hx-trigger="change from:select, change from:input[type=date], keyup changed delay:300ms from:input[type=text]"
        @submit.prevent>
    <div class="grid grid-cols-2 gap-3">
      {% if not user|is_patient_role %}
        <div class="col-span-2">
          <label for="patient_id" class="block text-xs font-semibold text-gray-700 mb-1">Search Patient</label>
          <div class="relative">
            <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none" aria-hidden="true"></i>
            <input type="text" id="patient_id" name="patient_id" value="{{ request.GET.patient_id|default:'' }}" autocomplete="off" class="block w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm" placeholder="Name or patient ID">
          </div>
        </div>
      {% endif %}
      <div>
        <label for="date_from" class="block text-xs font-semibold text-gray-700 mb-1">From</label>
        <input type="date" id="date_from" name="date_from" value="{{ request.GET.date_from }}" class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm">
      </div>
      <div>
        <label for="date_to" class="block text-xs font-semibold text-gray-700 mb-1">To</label>
        <input type="date" id="date_to" name="date_to" value="{{ request.GET.date_to }}" class="block w-full px-3 py-2 border border-gray-300 rounded-lg bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 text-sm">
      </div>
    </div>
  </form>

  <div id="jmcfi-mr-list-table-fragment">
    {% include "medical_records/_mr_list_table_fragment.html" %}
  </div>
</div>
