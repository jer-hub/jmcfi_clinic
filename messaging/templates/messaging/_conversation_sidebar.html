<aside class="flex h-full w-full flex-col border-b border-gray-200 bg-white lg:w-[23rem] lg:border-b-0 lg:border-r lg:border-gray-200">
    <div class="border-b border-gray-200 px-3 py-3 sm:px-4">
        <div class="flex items-center justify-between gap-2">
            <div>
                <p class="text-xs font-semibold uppercase tracking-[0.22em] text-primary-700">Messages</p>
                <h2 class="mt-0.5 text-lg font-bold text-gray-900">Chats</h2>
            </div>
            <div class="flex items-center gap-2">
                {% if can_start_direct %}
                <a href="{% url 'messaging:start_conversation' %}" class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-primary-600 text-white transition hover:bg-primary-700" title="New message" aria-label="New message">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-4 w-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </a>
                {% endif %}
            </div>
        </div>
        <div class="mt-3">
            <label for="conversation-search" class="sr-only">Search conversations</label>
            <div class="relative">
                <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-4 w-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 5.4 5.4a7.5 7.5 0 0 0 11.25 11.25Z" />
                    </svg>
                </span>
                <input id="conversation-search" type="search" placeholder="Search chats" class="block w-full rounded-full border border-gray-300 bg-gray-50 py-2 pl-9 pr-3 text-sm text-gray-900 focus:border-primary-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-100">
            </div>
        </div>
    </div>

    <div id="conversation-list" class="min-h-0 flex-1 overflow-y-auto">
        {% include 'messaging/_conversation_list_items.html' %}
    </div>
</aside>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const search = document.getElementById('conversation-search');
    const items = document.querySelectorAll('[data-conversation-item]');
    if (!search) {
      return;
    }

    search.addEventListener('input', function () {
      const term = (search.value || '').toLowerCase().trim();
      items.forEach(function (item) {
        const haystack = item.dataset.search || '';
        item.style.display = !term || haystack.indexOf(term) !== -1 ? '' : 'none';
      });
    });

    // Real-time unread count and conversation updates via WebSocket
    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const socketUrl = protocol + '://' + window.location.host + '/ws/messages/unread/';
    let socket = null;
    let reconnectAttempts = 0;
    let reconnectTimer = null;

    // Debouncing for grouped notifications from same sender
    const pendingConversationUpdates = {};
    const pendingUnreadUpdates = {};
    const UPDATE_DEBOUNCE_MS = 1500; // Wait 1.5 seconds for more messages from same person

    function getSenderKey(senderId, fallbackKey) {
      if (senderId !== null && senderId !== undefined && senderId !== '') {
        return 'sender_' + String(senderId);
      }
      return fallbackKey;
    }

    function debouncedTotalUnreadUpdate(totalUnreadCount, senderId) {
      const key = getSenderKey(senderId, 'unread_fallback');
      if (pendingUnreadUpdates[key]) {
        clearTimeout(pendingUnreadUpdates[key].timeoutId);
      }

      pendingUnreadUpdates[key] = {
        count: totalUnreadCount,
        timeoutId: setTimeout(function () {
          updateTotalUnreadCount(pendingUnreadUpdates[key].count);
          delete pendingUnreadUpdates[key];
        }, UPDATE_DEBOUNCE_MS),
      };
    }

    function debouncedConversationUpdate(conversationData) {
      const senderKey = getSenderKey(conversationData.sender_id, 'conversation_' + String(conversationData.conversation_id));

      if (pendingConversationUpdates[senderKey]) {
        clearTimeout(pendingConversationUpdates[senderKey].timeoutId);
      }

      pendingConversationUpdates[senderKey] = {
        data: conversationData,
        timeoutId: setTimeout(function () {
          updateConversationInSidebar(pendingConversationUpdates[senderKey].data);
          delete pendingConversationUpdates[senderKey];
        }, UPDATE_DEBOUNCE_MS),
      };
    }

    function connectUnreadSocket() {
      if (!window.WebSocket) {
        return;
      }

      socket = new WebSocket(socketUrl);
      
      socket.onopen = function () {
        reconnectAttempts = 0;
        console.log('Connected to unread messages WebSocket');
      };

      socket.onmessage = function (event) {
        const payload = JSON.parse(event.data);
        if (payload.type === 'unread_count') {
          debouncedTotalUnreadUpdate(payload.unread_count, payload.sender_id);
        } else if (payload.type === 'conversation_update') {
          debouncedConversationUpdate(payload);
        }
      };

      socket.onclose = function () {
        reconnectAttempts += 1;
        if (reconnectAttempts <= 5) {
          const delay = Math.min(1000 * reconnectAttempts, 5000);
          reconnectTimer = window.setTimeout(connectUnreadSocket, delay);
        }
      };

      socket.onerror = function (error) {
        console.error('Unread messages socket error:', error);
      };
    }

    function updateTotalUnreadCount(totalUnreadCount) {
      // Update total unread count in navbar badge
      const countElement = document.querySelector('[data-unread-count]');
      const badgeElement = document.querySelector('[data-unread-badge]');
      
      if (countElement && badgeElement) {
        if (totalUnreadCount > 0) {
          countElement.textContent = totalUnreadCount > 9 ? '9+' : totalUnreadCount;
          badgeElement.classList.remove('hidden');
        } else {
          badgeElement.classList.add('hidden');
        }
      }
    }

    function updateConversationInSidebar(conversationData) {
      const conversationId = conversationData.conversation_id;
      const unreadCount = Number(conversationData.unread_count) || 0;
      const activeId = document.querySelector('[data-conversation-item].bg-primary-50')?.dataset?.conversationId;
      const effectiveUnread = String(conversationId) === String(activeId) ? 0 : unreadCount;
      const links = document.querySelectorAll('[data-conversation-item][data-conversation-id="' + conversationId + '"]');

      links.forEach(function (link) {
        const badge = link.querySelector('[data-unread-badge="' + conversationId + '"]');
        if (badge) {
          if (effectiveUnread > 0) {
            badge.textContent = effectiveUnread > 9 ? '9+' : String(effectiveUnread);
            badge.className = 'inline-flex h-5 min-w-[1.25rem] shrink-0 items-center justify-center rounded-full bg-primary-600 px-1.5 text-[10px] font-bold leading-none text-white tabular-nums';
            badge.classList.remove('hidden');
            badge.setAttribute('aria-label', effectiveUnread + ' unread');
          } else {
            badge.classList.add('hidden');
            badge.textContent = '';
            badge.removeAttribute('aria-label');
          }
        }

        const preview = link.querySelector('.text-xs.text-gray-600');
        if (preview && conversationData.last_message_preview) {
          preview.textContent = conversationData.last_message_preview;
        }
      });

      links.forEach(function (link) {
        const listEl = link.parentElement;
        if (listEl) {
          listEl.insertBefore(link, listEl.firstChild);
        }
      });
    }

    connectUnreadSocket();
  });
</script>
